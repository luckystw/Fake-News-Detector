<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ef 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            background: #fff;
            padding: 40px 32px 32px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1a237e;
            margin-bottom: 16px;
        }
        p {
            text-align: center;
            color: #555;
            margin-bottom: 32px;
        }
        textarea {
            width: 100%;
            height: 120px;
            margin-bottom: 24px;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #b0bec5;
            border-radius: 8px;
            resize: vertical;
            background: #f4f7fa;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #3949ab;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #283593;
        }
        .results {
            margin-top: 32px;
            background: #f1f8e9;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(76,175,80,0.07);
        }
        .results h2 {
            margin-top: 0;
            color: #388e3c;
            font-size: 20px;
        }
        .model-result {
            margin: 10px 0;
            font-size: 17px;
            display: flex;
            justify-content: space-between;
        }
        .label {
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 6px;
        }
        .label.Fake {
            background: #ffcdd2;
            color: #b71c1c;
        }
        .label.Real {
            background: #c8e6c9;
            color: #1b5e20;
        }
        .label.True {
            background: #b3e5fc;
            color: #01579b;
        }
        .label.False, .label[title="False"] {
            background: #ffe0b2;
            color: #e65100;
        }
        .label[title="Mostly False"], .label[title="Misleading"] {
            background: #fff9c4;
            color: #827717;
        }
        .error {
            color: #b71c1c;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fake News Detector</h1>
        <p>Enter a news article or statement to check if it's real or fake using multiple AI models.</p>
        <textarea id="newsText" placeholder="Paste news text here..."></textarea>
        <button onclick="checkNews()">Check News</button>
        <div class="results" id="results" style="display:none;"></div>
        <div class="error" id="error"></div>
    </div>
    <script>
        function labelClass(label) {
            if (label === 'Fake') return 'label Fake';
            if (label === 'Real') return 'label Real';
            if (label === 'True') return 'label True';
            if (label === 'False') return 'label False';
            if (label === 'Mostly False') return 'label';
            if (label === 'Misleading') return 'label';
            return 'label';
        }
        async function checkNews() {
            const text = document.getElementById('newsText').value.trim();
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').textContent = '';
            if (!text) {
                document.getElementById('error').textContent = 'Please enter some news text.';
                return;
            }
            document.getElementById('error').textContent = 'Checking...';
            try {
                const response = await fetch('http://localhost:5000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await response.json();
                if (data.error) {
                    document.getElementById('error').textContent = data.error;
                    return;
                }
                let html = '<h2>Model Predictions</h2>';
                for (const [model, result] of Object.entries(data.ml_results)) {
                    html += `<div class="model-result"><span>${model}</span> <span class="${labelClass(result)}">${result}</span></div>`;
                }
                html += `<div class="model-result"><span>Transformer (BERT-like)</span> <span class="${labelClass(data.transformer_result)}" title="${data.transformer_result}">${data.transformer_result}</span></div>`;
                document.getElementById('results').innerHTML = html;
                document.getElementById('results').style.display = 'block';
                document.getElementById('error').textContent = '';
            } catch (e) {
                document.getElementById('error').textContent = 'Error connecting to backend.';
            }
        }
    </script>
</body>
</html>
